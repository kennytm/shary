[package]
name = "shary"
version = "0.2.2"
authors = ["kennytm <kennytm@gmail.com>"]
edition = "2024"
description = "HTTP server for sharing files and text snippets in LAN"
exclude = ["minimize.sh", "src/web/index.html"]
license = "MIT"
homepage = "https://github.com/kennytm/shary"
repository = "https://github.com/kennytm/shary"
readme = "README.md"
keywords = ["file-sharing"]

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
hostname = "0.3.1"
if-addrs = "0.15"
mime = "0.3"
serde = { version = "1.0.114", features = ["derive"] }
serde_json = "1"
tempfile = "3.1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
xflags = "0.3"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }

[features]
read_index_html_from_file_system = []
